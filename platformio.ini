[env:blackpill_f411ce]
platform = ststm32@^20.0.0
board = blackpill_f411ce
# Secteurs 5 (0x08020000, copie B), 6 (0x08040000, journal) et 7
# (0x08060000, copie A) reserves : le firmware tient dans les secteurs 0-4.
board_upload.maximum_size = 131072
framework = arduino

upload_protocol = dfu
monitor_speed = 115200

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON

lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    SPI
    Wire
